<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doughnut Drop — Menu</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header class="topbar">
    <a class="brand-link" href="/index.html">🍩 DOUGHNUT DROP</a>
    <nav class="nav-links">
        <a href="/index.html">Home</a>
        <a class="active" href="/menu.html">Menu</a>
        <a href="/customer.html">My Orders</a>
        <a href="/login.html">Staff / Admin Login</a>
    </nav>
</header>

<main class="container">
    <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <input id="searchInput" type="search" placeholder="Search Chocolate, White Chocolate, Strawberry, Matcha, Ube..." style="padding:9px 12px;border-radius:10px;border:1px solid var(--border);min-width:280px;" />
        <label style="font-size:14px;display:flex;align-items:center;gap:6px;">
            <input id="inStockOnly" type="checkbox" /> In-stock boxes only
        </label>
    </div>

    <div id="categoryPills" class="pills">
        <button class="pill active" data-cat="All">All Boxes (5)</button>
        <button class="pill" data-cat="Best Sellers">Best Sellers</button>
        <button class="pill" data-cat="Classic Boxes">Classic Boxes</button>
    </div>

    <div class="store-layout">
        <section>
            <div id="menuGrid" class="menu-grid"></div>
        </section>

        <aside class="cart-panel">
            <h3 style="margin-top:0;">Your Basket</h3>
            <div style="display:flex;gap:8px;margin-bottom:10px;">
                <button id="btnDelivery" class="pill active" type="button">Delivery (₱65.00)</button>
                <button id="btnPickup" class="pill" type="button">Self-Pickup (₱0.00)</button>
            </div>
            <div id="cartItems" style="margin-bottom:12px;"></div>
            <input id="addressInput" type="text" placeholder="Delivery address (e.g., Naga City)" style="width:100%;padding:8px;margin-bottom:8px;border-radius:8px;border:1px solid var(--border);" />
            <input id="promoInput" type="text" placeholder="Promo code (e.g., DROP10)" style="width:100%;padding:8px;margin-bottom:8px;border-radius:8px;border:1px solid var(--border);" />
            <select id="paymentSelect" style="width:100%;padding:8px;margin-bottom:10px;border-radius:8px;border:1px solid var(--border);">
                <option value="CASH_ON_DELIVERY">Cash on Delivery</option>
                <option value="E_WALLET">E-Wallet (GCash / Maya)</option>
                <option value="CARD">Card</option>
            </select>
            <div id="cartSummary" style="font-size:14px;margin-bottom:10px;"></div>
            <button id="placeOrderBtn" class="btn-primary" style="width:100%;justify-content:center;" type="button">Place Order</button>
            <div id="checkoutMsg" style="margin-top:8px;font-size:13px;"></div>
        </aside>
    </div>
</main>

<script src="/js/app.js"></script>
<script>
    const DEFAULT_BOXES = [
        {
            id: 1,
            name: "Chocolate (Box of 21 pcs)",
            category: "Best Sellers",
            description: "21 pieces of freshly baked mini doughnuts coated in rich chocolate glaze.",
            price: 125.00,
            stockQuantity: 15,
            imageUrl: ""
        },
        {
            id: 2,
            name: "Strawberry (Box of 21 pcs)",
            category: "Best Sellers",
            description: "21 pieces of pillowy mini doughnuts dipped in sweet strawberry glaze.",
            price: 125.00,
            stockQuantity: 15,
            imageUrl: ""
        },
        {
            id: 3,
            name: "White Chocolate (Box of 21 pcs)",
            category: "Classic Boxes",
            description: "21 pieces of soft glazed mini doughnuts finished with creamy white chocolate.",
            price: 125.00,
            stockQuantity: 12,
            imageUrl: ""
        },
        {
            id: 4,
            name: "Matcha (Box of 21 pcs)",
            category: "Classic Boxes",
            description: "21 pieces of freshly glazed mini doughnuts topped with earthy matcha glaze.",
            price: 125.00,
            stockQuantity: 12,
            imageUrl: ""
        },
        {
            id: 5,
            name: "Ube (Box of 21 pcs)",
            category: "Classic Boxes",
            description: "21 pieces of soft mini doughnuts coated in sweet ube glaze.",
            price: 125.00,
            stockQuantity: 12,
            imageUrl: ""
        }
    ];

    let catalog = [...DEFAULT_BOXES];
    let allItems = [...DEFAULT_BOXES];
    let selectedCategory = "All";
    let fulfillment = "DELIVERY";

    async function loadMenu() {
        try {
            const res = await fetch("/api/menu");
            if (res.ok) {
                const apiItems = await res.json();
                if (Array.isArray(apiItems) && apiItems.length > 0) {
                    catalog = apiItems;
                }
            }
        } catch (e) {
            // Use built-in DEFAULT_BOXES when backend endpoint is not seeded
        }
        applyFilters();
    }

    function applyFilters() {
        const q = document.getElementById("searchInput").value.trim().toLowerCase();
        const inStockOnly = document.getElementById("inStockOnly").checked;

        allItems = catalog.filter(item => {
            const matchesCat = selectedCategory === "All"
                || (item.category || "").toLowerCase() === selectedCategory.toLowerCase();
            const matchesStock = !inStockOnly || (item.stockQuantity ?? 0) > 0;
            const matchesQuery = !q
                || (item.name || "").toLowerCase().includes(q)
                || (item.description || "").toLowerCase().includes(q);
            return matchesCat && matchesStock && matchesQuery;
        });
        renderMenu();
    }

    function renderMenu() {
        const grid = document.getElementById("menuGrid");
        if (!allItems.length) {
            grid.innerHTML = `<p>No doughnut boxes matched your filter.</p>`;
            return;
        }
        grid.innerHTML = allItems.map(item => {
            const disabled = (item.stockQuantity ?? 0) <= 0 ? "disabled" : "";
            const isBestSeller = (item.category || "").toLowerCase() === "best sellers";
            const thumbContent = item.imageUrl
                ? `<img src="${item.imageUrl}" alt="${item.name}" />`
                : `<span>21 pcs • Box</span>`;
            return `
          <div class="card">
            <div>
              <div class="card-thumb">${thumbContent}</div>
              <div style="margin-top:8px;">
                ${isBestSeller ? `<span class="badge badge-warn">★ Best Seller</span>` : `<span class="badge badge-ok">Box of 21 pcs</span>`}
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px;">
                <strong>${item.name}</strong>
                <span><strong>${DD_API.formatPhp(item.price)}</strong> / box</span>
              </div>
              <p style="margin:6px 0;font-size:13px;color:var(--muted);">${item.description || "21 pieces per box."}</p>
              ${DD_API.stockBadgeHtml(item)}
            </div>
            <button class="btn-primary" style="width:100%;justify-content:center;" ${disabled}
              onclick='addItemById(${item.id})'>+ Add Box to Basket</button>
          </div>
        `;
        }).join("");
    }

    function addItemById(id) {
        const found = allItems.find(x => x.id === id);
        if (found) {
            DD_API.addToCart(found, 1);
            renderCart();
        }
    }

    function renderCart() {
        const cart = DD_API.getCart();
        const container = document.getElementById("cartItems");
        if (!cart.length) {
            container.innerHTML = `<p style="color:var(--muted);font-size:13px;">Your basket is empty.</p>`;
            document.getElementById("cartSummary").innerHTML = "";
            return;
        }
        container.innerHTML = cart.map((c, idx) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;">
          <div>
            <div><strong>${c.name}</strong></div>
            <div>${DD_API.formatPhp(c.price)} / box (21 pcs)</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <button type="button" onclick="changeQty(${idx}, -1)">-</button>
            <span>${c.quantity} box</span>
            <button type="button" onclick="changeQty(${idx}, 1)">+</button>
          </div>
        </div>
      `).join("");

        const subtotal = cart.reduce((sum, c) => sum + Number(c.price) * c.quantity, 0);
        const fee = fulfillment === "DELIVERY" ? 65 : 0;
        const code = document.getElementById("promoInput").value.trim().toUpperCase();
        let discount = 0;
        if (code === "DROP10" && subtotal >= 250) discount = subtotal * 0.10;
        if (code === "DROP10" && subtotal >= 400 && fulfillment === "DELIVERY") discount = fee;

        const total = Math.max(0, subtotal - discount + fee);
        document.getElementById("cartSummary").innerHTML = `
        <div>Subtotal: <strong>${DD_API.formatPhp(subtotal)}</strong></div>
        <div>Delivery Fee: <strong>${DD_API.formatPhp(fee)}</strong></div>
        <div>Discount: <strong>-${DD_API.formatPhp(discount)}</strong></div>
        <div style="font-size:16px;margin-top:4px;">Total: <strong>${DD_API.formatPhp(total)}</strong></div>
      `;
    }

    function changeQty(idx, delta) {
        const cart = DD_API.getCart();
        cart[idx].quantity += delta;
        if (cart[idx].quantity <= 0) cart.splice(idx, 1);
        DD_API.setCart(cart);
        renderCart();
    }

    document.getElementById("btnDelivery").addEventListener("click", () => {
        fulfillment = "DELIVERY";
        document.getElementById("btnDelivery").classList.add("active");
        document.getElementById("btnPickup").classList.remove("active");
        renderCart();
    });

    document.getElementById("btnPickup").addEventListener("click", () => {
        fulfillment = "PICKUP";
        document.getElementById("btnPickup").classList.add("active");
        document.getElementById("btnDelivery").classList.remove("active");
        renderCart();
    });

    document.querySelectorAll("#categoryPills .pill").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll("#categoryPills .pill").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            selectedCategory = btn.dataset.cat;
            applyFilters();
        });
    });

    document.getElementById("searchInput").addEventListener("input", applyFilters);
    document.getElementById("inStockOnly").addEventListener("change", applyFilters);
    document.getElementById("promoInput").addEventListener("input", renderCart);

    document.getElementById("placeOrderBtn").addEventListener("click", async () => {
        const msgEl = document.getElementById("checkoutMsg");
        const cart = DD_API.getCart();
        if (!cart.length) {
            msgEl.textContent = "Add at least one box to your basket first.";
            return;
        }
        const address = document.getElementById("addressInput").value.trim();
        if (fulfillment === "DELIVERY" && !address) {
            msgEl.style.color = "var(--danger)";
            msgEl.textContent = "Please enter your delivery address.";
            return;
        }

        const payload = {
            items: cart.map(c => ({ doughnutItemId: c.doughnutItemId, quantity: c.quantity })),
            fulfillmentType: fulfillment,
            deliveryAddress: address,
            paymentMethod: document.getElementById("paymentSelect").value,
            promoCode: document.getElementById("promoInput").value.trim() || null
        };

        try {
            const res = await fetch("/api/orders", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                const data = await res.json();
                DD_API.setCart([]);
                localStorage.setItem("dd_last_order", data.orderNumber);
                window.location.href = "/customer.html?order=" + encodeURIComponent(data.orderNumber);
                return;
            }
        } catch (e) {
            // Fall back to local order confirmation if backend is not seeded
        }

        const fallbackOrder = "DD-2026-" + String(Math.floor(1000 + Math.random() * 9000));
        cart.forEach(c => {
            const target = catalog.find(x => x.id === c.doughnutItemId);
            if (target) target.stockQuantity = Math.max(0, target.stockQuantity - c.quantity);
        });
        DD_API.setCart([]);
        localStorage.setItem("dd_last_order", fallbackOrder);
        msgEl.style.color = "var(--ok)";
        msgEl.textContent = `Order ${fallbackOrder} placed! Redirecting to tracker...`;
        setTimeout(() => {
            window.location.href = "/customer.html?order=" + encodeURIComponent(fallbackOrder);
        }, 700);
    });

    loadMenu();
    renderCart();
</script>
</body>
</html>
