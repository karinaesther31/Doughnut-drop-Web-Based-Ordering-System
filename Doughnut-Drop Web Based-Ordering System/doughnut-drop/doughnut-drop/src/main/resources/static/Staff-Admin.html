<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doughnut Drop — Staff &amp; Admin Portal</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header class="topbar">
    <a class="brand-link" href="/index.html">🍩 DOUGHNUT DROP PORTAL</a>
    <nav class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/menu.html">Menu</a>
        <a class="active" href="/staff-admin.html">Staff / Admin</a>
        <button id="logoutBtn" class="btn-ghost" type="button">Logout</button>
    </nav>
</header>

<main class="container">
    <h2>Incoming Orders</h2>
    <div id="portalOrders" style="margin-bottom:28px;"></div>

    <h2>Daily Batch &amp; Menu Inventory</h2>
    <div style="overflow-x:auto;">
        <table>
            <thead>
            <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
        </table>
    </div>
</main>

<script src="/js/app.js"></script>
<script>
    if (!DD_API.getSession()) {
        window.location.href = "/login.html";
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
        DD_API.setSession(null);
        window.location.href = "/login.html";
    });

    async function loadOrders() {
        const res = await fetch("/api/orders");
        const orders = await res.json();
        document.getElementById("portalOrders").innerHTML = orders.map(o => `
        <div class="card" style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">
            <div>
              <strong>${o.orderNumber}</strong> • ${o.status} • ${DD_API.formatPhp(o.totalAmount)}
              <div style="font-size:13px;color:var(--muted);">${o.items.map(i => `${i.quantity}x ${i.name}`).join(", ")}</div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn-ghost" type="button" onclick="setOrderStatus(${o.id}, 'PREPARING')">Preparing</button>
              <button class="btn-ghost" type="button" onclick="setOrderStatus(${o.id}, 'OUT_FOR_DELIVERY')">Out for Delivery</button>
              <button class="btn-primary" type="button" onclick="setOrderStatus(${o.id}, 'DELIVERED')">Delivered</button>
              <button class="btn-ghost" type="button" onclick="setOrderStatus(${o.id}, 'CANCELLED')">Cancel</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    async function setOrderStatus(id, status) {
        let riderName = null;
        let riderPhone = null;
        if (status === "OUT_FOR_DELIVERY") {
            riderName = prompt("Rider Name:", "Kuya Carlo") || null;
            riderPhone = prompt("Rider Contact:", "+63 917 812 3456") || null;
        }
        const res = await fetch(`/api/orders/${id}/status`, {
            method: "PATCH",
            headers: DD_API.authHeaders(),
            body: JSON.stringify({ status, riderName, riderPhone })
        });
        if (!res.ok) {
            const err = await res.json();
            alert(err.error || "Action failed. Check Staff/Admin role.");
            return;
        }
        await loadOrders();
        await loadInventory();
    }

    async function loadInventory() {
        const res = await fetch("/api/menu");
        const items = await res.json();
        document.getElementById("inventoryBody").innerHTML = items.map(item => `
        <tr>
          <td><strong>${item.name}</strong></td>
          <td>${item.category}</td>
          <td>${DD_API.formatPhp(item.price)}</td>
          <td>${DD_API.stockBadgeHtml(item)}</td>
          <td>
            <button class="btn-ghost" type="button" onclick="adjustStock(${item.id}, 12)">+12</button>
            <button class="btn-ghost" type="button" onclick="setPhotoUrl(${item.id}, '${encodeURIComponent(item.imageUrl || "")}')">Photo URL</button>
          </td>
        </tr>
      `).join("");
    }

    async function adjustStock(id, delta) {
        const res = await fetch(`/api/menu/${id}/stock`, {
            method: "PATCH",
            headers: DD_API.authHeaders(),
            body: JSON.stringify({ delta })
        });
        if (!res.ok) {
            alert("Stock update requires Staff or Admin login.");
            return;
        }
        await loadInventory();
    }

    async function setPhotoUrl(id, encodedCurrent) {
        const current = decodeURIComponent(encodedCurrent);
        const url = prompt("Paste image URL (or leave blank to clear):", current);
        if (url === null) return;
        const itemRes = await fetch(`/api/menu/${id}`);
        const item = await itemRes.json();
        const res = await fetch(`/api/menu/${id}`, {
            method: "PUT",
            headers: DD_API.authHeaders(),
            body: JSON.stringify({
                name: item.name,
                category: item.category,
                dietaryTags: item.dietaryTags,
                description: item.description,
                ingredients: item.ingredients,
                allergens: item.allergens,
                calories: item.calories,
                price: item.price,
                stockQuantity: item.stockQuantity,
                imageUrl: url.trim()
            })
        });
        if (!res.ok) {
            alert("Photo update requires Staff or Admin login.");
            return;
        }
        await loadInventory();
    }

    loadOrders();
    loadInventory();
</script>
</body>
</html>
