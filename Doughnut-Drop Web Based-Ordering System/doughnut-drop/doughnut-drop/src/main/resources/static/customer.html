<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doughnut Drop — Order Tracker</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="topbar">
    <a class="brand-link" href="/index.html">DOUGHNUT DROP</a>
    <nav class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/menu.html">Menu</a>
        <a class="active" href="/customer.html">My Orders</a>
        <a href="/login.html">Staff / Admin Login</a>
    </nav>
</header>

<main class="container">
    <h2>Live Order Tracker</h2>
    <div style="display:flex;gap:8px;margin-bottom:14px;">
        <input id="trackInput" type="text" aria-label="Order number" placeholder="Order number (e.g., DD-2026-0001)" />
        <button id="trackBtn" class="btn-primary" type="button">Track</button>
    </div>
    <div id="trackerBox" class="card" style="margin-bottom:24px;">Enter an order number above to track your box order.</div>

    <h3>Recent Orders</h3>
    <div id="ordersList"></div>
</main>

<script src="/js/app.js"></script>
<script>
    async function loadTracker(orderNumber) {
        const num = (orderNumber || document.getElementById("trackInput").value || localStorage.getItem("dd_last_order") || "").trim();
        const box = document.getElementById("trackerBox");
        if (!num) {
            box.textContent = "Enter an order number above to track your box order.";
            return;
        }
        document.getElementById("trackInput").value = num;
        try {
            const res = await fetch("/api/orders/" + encodeURIComponent(num));
            if (!res.ok) {
                box.textContent = "Order not found: " + num;
                return;
            }
            const o = await res.json();
            const items = Array.isArray(o.items) ? o.items : [];
            const summary = items.map(i => `${i.quantity}x ${i.name}`).join(", ");
            box.innerHTML = `
                <div><strong>Order #${o.orderNumber}</strong> — Status: <strong>${o.status}</strong></div>
                <div style="margin-top:6px;color:var(--muted);">${summary}</div>
                <div style="margin-top:6px;">Total: <strong>${DD_API.formatPhp(o.totalAmount)}</strong></div>
            `;
        } catch (err) {
            box.textContent = "Unable to load order right now.";
        }
    }

    async function loadRecentOrders() {
        const list = document.getElementById("ordersList");
        try {
            const res = await fetch("/api/orders/recent");
            if (!res.ok) {
                list.innerHTML = `<p style="color:var(--muted);">No recent orders yet.</p>`;
                return;
            }
            const orders = await res.json();
            if (!Array.isArray(orders) || orders.length === 0) {
                list.innerHTML = `<p style="color:var(--muted);">No recent orders yet.</p>`;
                return;
            }
            list.innerHTML = orders.map(o => {
                const items = Array.isArray(o.items) ? o.items : [];
                const lineText = items.map(i => `${i.quantity}x ${i.name}`).join(", ");
                const safeJson = encodeURIComponent(JSON.stringify(items));
                return `
                    <div class="card" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;">
                        <div>
                            <strong>${o.orderNumber}</strong> - ${o.status} (${DD_API.formatPhp(o.totalAmount)})
                            <div style="font-size:13px;color:var(--muted);">${lineText}</div>
                        </div>
                        <div style="display:flex;gap:8px;">
                            <button class="btn-ghost" type="button" onclick="loadTracker('${o.orderNumber}')">Track</button>
                            <button class="btn-primary" type="button" onclick="reorderEncoded('${safeJson}')">Reorder</button>
                        </div>
                    </div>
                `;
            }).join("");
        } catch (err) {
            list.innerHTML = `<p style="color:var(--muted);">No recent orders yet.</p>`;
        }
    }

    function reorderEncoded(encodedItems) {
        try {
            const items = JSON.parse(decodeURIComponent(encodedItems));
            if (Array.isArray(items)) {
                items.forEach(item => {
                    DD_API.addToCart({
                        id: item.doughnutItemId || item.id,
                        name: item.name,
                        price: item.price || 125.00
                    }, item.quantity || 1);
                });
                window.location.href = "/menu.html";
            }
        } catch (err) {
            window.location.href = "/menu.html";
        }
    }

    document.getElementById("trackBtn").addEventListener("click", () => loadTracker());
    const params = new URLSearchParams(window.location.search);
    loadTracker(params.get("order"));
    loadRecentOrders();
</script>
</body>
</html>
