<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doughnut Drop — Login &amp; Create Account</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .auth-wrapper {
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
            padding: 0 16px;
        }
        .auth-card {
            background: rgba(42, 24, 16, 0.44);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 250, 245, 0.38);
            border-radius: 24px;
            padding: 36px 30px 30px;
            box-shadow: 0 20px 45px rgba(24, 12, 8, 0.35);
            color: #fff;
        }
        .auth-title {
            margin: 0 0 8px;
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 0.01em;
            color: #fff;
        }
        .auth-subtitle {
            margin: 0 0 24px;
            text-align: center;
            font-size: 13px;
            line-height: 1.45;
            color: rgba(255, 250, 245, 0.88);
        }
        .auth-field {
            margin-bottom: 14px;
        }
        .auth-field label.sr-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            color: rgba(255, 250, 245, 0.92);
        }
        .input-glass {
            position: relative;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 250, 245, 0.55);
            border-radius: 12px;
            background: rgba(255, 250, 245, 0.12);
            transition: border-color 0.2s, background 0.2s;
        }
        .input-glass:focus-within {
            border-color: var(--accent);
            background: rgba(255, 250, 245, 0.18);
        }
        .input-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding-left: 14px;
            color: rgba(255, 250, 245, 0.9);
            flex-shrink: 0;
        }
        .input-glass input,
        .input-glass select {
            width: 100%;
            padding: 12px 14px;
            border: none;
            outline: none;
            background: transparent;
            color: #fff;
            font-size: 14px;
        }
        .input-glass input::placeholder {
            color: rgba(255, 250, 245, 0.78);
        }
        .input-glass select option {
            background: var(--ink);
            color: #fff;
        }
        .toggle-pass-btn {
            background: transparent;
            border: none;
            color: rgba(255, 250, 245, 0.85);
            padding: 0 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }
        .toggle-pass-btn:hover {
            color: #fff;
        }
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 6px 0 20px;
            font-size: 13px;
            color: rgba(255, 250, 245, 0.92);
        }
        .remember-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        .remember-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .btn-glass-submit {
            width: 100%;
            justify-content: center;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 15px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            box-shadow: 0 8px 20px rgba(224, 59, 139, 0.35);
        }
        .btn-glass-submit:hover {
            filter: brightness(1.06);
        }
        .auth-switch {
            text-align: center;
            font-size: 13px;
            margin: 18px 0 0;
            color: rgba(255, 250, 245, 0.9);
        }
        .auth-switch a {
            color: #ff8dc4;
            font-weight: 700;
            text-decoration: none;
        }
        .auth-switch a:hover {
            text-decoration: underline;
        }
        .auth-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 520px) {
            .auth-row {
                grid-template-columns: 1fr;
            }
        }
        .auth-status {
            margin-top: 12px;
            font-size: 13px;
            text-align: center;
            min-height: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<header class="topbar">
    <span class="brand-link">🍩 DOUGHNUT DROP</span>
</header>

<main class="login-section">
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Sign In Form -->
            <form id="login" data-form="login">
                <h2 class="auth-title">Login</h2>
                <p class="auth-subtitle">
                    Welcome back! Customers go straight to Menu to order; Staff &amp; Admin go to Dashboard.
                </p>

                <div class="auth-field">
                    <div class="input-glass">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                            </svg>
                        </span>
                        <input id="loginIdentifier" type="text" placeholder="Username or Email" aria-label="Username or Email" required />
                    </div>
                </div>

                <div class="auth-field">
                    <div class="input-glass">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                            </svg>
                        </span>
                        <input id="loginPassword" type="password" placeholder="Password (optional for Customer)" aria-label="Password" />
                        <button type="button" id="toggleLoginPass" class="toggle-pass-btn" aria-label="Show or hide password">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="remember-row">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe" checked />
                        <span>Remember me</span>
                    </label>
                </div>

                <button class="btn-primary btn-glass-submit" type="submit">
                    Login
                </button>

                <p class="auth-switch">
                    Don&apos;t have an account?
                    <a href="#register" id="switchToRegisterLink">Create Account</a>
                </p>
            </form>

            <!-- Create Account Form -->
            <form id="register" data-form="register" style="display:none;">
                <h2 class="auth-title">Create Account</h2>
                <p class="auth-subtitle">
                    Register a new account for Doughnut Drop.
                </p>

                <div class="auth-field">
                    <div class="input-glass">
                        <input id="regFullName" type="text" placeholder="Full Name" required />
                    </div>
                </div>

                <div class="auth-row">
                    <div class="auth-field">
                        <div class="input-glass">
                            <input id="regUsername" type="text" placeholder="Username" required />
                        </div>
                    </div>

                    <div class="auth-field">
                        <div class="input-glass">
                            <input id="regMobile" type="text" placeholder="Mobile Number" required />
                        </div>
                    </div>
                </div>

                <div class="auth-field">
                    <div class="input-glass">
                        <input id="regEmail" type="email" placeholder="Email Address" required />
                    </div>
                </div>

                <div class="auth-field">
                    <div class="input-glass">
                        <input id="regAddress" type="text" placeholder="Default Delivery Address" required />
                    </div>
                </div>

                <div class="auth-row">
                    <div class="auth-field">
                        <label class="sr-label" for="regFulfillment">Fulfillment</label>
                        <div class="input-glass">
                            <select id="regFulfillment" required>
                                <option value="DELIVERY">DELIVERY</option>
                                <option value="PICK_UP">PICK_UP</option>
                            </select>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label class="sr-label" for="regPayment">Payment</label>
                        <div class="input-glass">
                            <select id="regPayment" required>
                                <option value="CASH">CASH</option>
                                <option value="ONLINE_PAYMENT">ONLINE_PAYMENT</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="auth-row">
                    <div class="auth-field">
                        <label class="sr-label" for="regRole">Role</label>
                        <div class="input-glass">
                            <select id="regRole" required>
                                <option value="ROLE_USER">Customer (ROLE_USER)</option>
                                <option value="ROLE_ADMIN">Staff / Admin (ROLE_ADMIN)</option>
                            </select>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label class="sr-label" for="regPassword">Password</label>
                        <div class="input-glass">
                            <input id="regPassword" type="password" placeholder="Required for Admin" />
                        </div>
                    </div>
                </div>

                <button class="btn-primary btn-glass-submit" type="submit">
                    Create Account
                </button>

                <p class="auth-switch">
                    Already have an account?
                    <a href="#login" id="switchToLoginLink">Login</a>
                </p>
            </form>

            <div id="authStatus" class="auth-status"></div>
        </div>
    </div>
</main>

<script src="/js/app.js"></script>
<script>
    (function () {
        const USERS_STORAGE_KEY = "dd_local_users_v1";
        const CURRENT_USER_KEY = "dd_current_user_v1";
        const REMEMBER_USER_KEY = "dd_remember_identifier_v1";

        const loginForm = document.getElementById("login");
        const registerForm = document.getElementById("register");
        const authStatus = document.getElementById("authStatus");
        const regRoleSelect = document.getElementById("regRole");
        const regPasswordInput = document.getElementById("regPassword");
        const loginIdentifierInput = document.getElementById("loginIdentifier");
        const loginPasswordInput = document.getElementById("loginPassword");
        const rememberMeCheckbox = document.getElementById("rememberMe");
        const toggleLoginPassBtn = document.getElementById("toggleLoginPass");

        function setStatus(message, isError) {
            authStatus.style.color = isError ? "#ffb4b4" : "#86efac";
            authStatus.textContent = message;
        }

        function syncPasswordRequirement() {
            const isAdmin = regRoleSelect.value === "ROLE_ADMIN";
            regPasswordInput.required = isAdmin;
            regPasswordInput.placeholder = isAdmin ? "Required for Admin" : "Optional for Customer";
        }

        function showMode(mode) {
            const isRegister = mode === "register";
            loginForm.style.display = isRegister ? "none" : "block";
            registerForm.style.display = isRegister ? "block" : "none";
            authStatus.textContent = "";
            syncPasswordRequirement();
        }

        function getLocalUsers() {
            try {
                return JSON.parse(localStorage.getItem(USERS_STORAGE_KEY) || "[]");
            } catch (err) {
                return [];
            }
        }

        function saveLocalUsers(users) {
            localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));
        }

        function redirectByRole(role) {
            window.location.href = role === "ROLE_ADMIN"
                ? "/admin/dashboard.html"
                : "/admin/products.html";
        }

        const savedIdentifier = localStorage.getItem(REMEMBER_USER_KEY);
        if (savedIdentifier) {
            loginIdentifierInput.value = savedIdentifier;
        }

        toggleLoginPassBtn.addEventListener("click", () => {
            const isHidden = loginPasswordInput.type === "password";
            loginPasswordInput.type = isHidden ? "text" : "password";
        });

        regRoleSelect.addEventListener("change", syncPasswordRequirement);

        document.getElementById("switchToRegisterLink").addEventListener("click", e => {
            e.preventDefault();
            showMode("register");
        });

        document.getElementById("switchToLoginLink").addEventListener("click", e => {
            e.preventDefault();
            showMode("login");
        });

        if (window.location.hash === "#register") {
            showMode("register");
        } else {
            syncPasswordRequirement();
        }

        loginForm.addEventListener("submit", async e => {
            e.preventDefault();
            const identifier = loginIdentifierInput.value.trim();
            const password = loginPasswordInput.value;

            if (rememberMeCheckbox.checked) {
                localStorage.setItem(REMEMBER_USER_KEY, identifier);
            } else {
                localStorage.removeItem(REMEMBER_USER_KEY);
            }

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: identifier,
                        email: identifier,
                        password: password || null
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(data));
                    setStatus("Signed in successfully! Redirecting...", false);
                    setTimeout(() => redirectByRole(data.role), 600);
                    return;
                }
                if (res.status === 400 || res.status === 401) {
                    const errData = await res.json().catch(() => ({}));
                    setStatus(errData.error || "Invalid username, email, or password.", true);
                    return;
                }
            } catch (err) {
                // Fall back to local storage if backend login endpoint is unavailable
            }

            const users = getLocalUsers();
            const matched = users.find(u =>
                u.username.toLowerCase() === identifier.toLowerCase() ||
                u.email.toLowerCase() === identifier.toLowerCase()
            );

            if (!matched) {
                setStatus("Account not found. Please create an account first.", true);
                return;
            }
            if (matched.password && matched.password !== password) {
                setStatus("Incorrect password.", true);
                return;
            }

            localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(matched));
            setStatus("Signed in as " + matched.fullName + "! Redirecting...", false);
            setTimeout(() => redirectByRole(matched.role), 600);
        });

        registerForm.addEventListener("submit", async e => {
            e.preventDefault();
            const fullName = document.getElementById("regFullName").value.trim();
            const username = document.getElementById("regUsername").value.trim();
            const mobileNumber = document.getElementById("regMobile").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const defaultDeliveryAddress = document.getElementById("regAddress").value.trim();
            const defaultFulfillmentType = document.getElementById("regFulfillment").value;
            const defaultPaymentMethod = document.getElementById("regPayment").value;
            const role = document.getElementById("regRole").value;
            const rawPassword = document.getElementById("regPassword").value;

            if (role === "ROLE_ADMIN" && !rawPassword) {
                setStatus("A password is required for Admin accounts.", true);
                return;
            }

            const payload = {
                fullName: fullName,
                username: username,
                email: email,
                mobileNumber: mobileNumber,
                defaultDeliveryAddress: defaultDeliveryAddress,
                defaultFulfillmentType: defaultFulfillmentType,
                defaultPaymentMethod: defaultPaymentMethod,
                password: rawPassword ? rawPassword : null,
                role: role
            };

            try {
                const res = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    setStatus("Account created! You can now sign in.", false);
                    registerForm.reset();
                    setTimeout(() => {
                        showMode("login");
                        loginIdentifierInput.value = username;
                    }, 700);
                    return;
                }
                if (res.status === 400 || res.status === 409) {
                    const errData = await res.json().catch(() => ({}));
                    setStatus(errData.error || "Could not create account.", true);
                    return;
                }
            } catch (err) {
                // Fall back to local storage if backend register endpoint is unavailable
            }

            const users = getLocalUsers();
            const duplicate = users.some(u =>
                u.username.toLowerCase() === username.toLowerCase() ||
                u.email.toLowerCase() === email.toLowerCase()
            );
            if (duplicate) {
                setStatus("An account with that username or email already exists.", true);
                return;
            }

            users.push(payload);
            saveLocalUsers(users);
            setStatus("Account created! Switching to Login...", false);
            registerForm.reset();
            setTimeout(() => {
                showMode("login");
                loginIdentifierInput.value = username;
            }, 700);
        });
    })();
</script>
</body>
</html>
